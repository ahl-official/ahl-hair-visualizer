<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="American Hairline — AI-powered hair consultation. Upload your portrait and get personalized hairstyle recommendations powered by Gemini AI." />
    <meta name="theme-color" content="#3A6BC4" />

    <!-- Progressive Web App (PWA) Manifest & Standalone App Support -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AHL Visualizer" />
    <meta name="application-name" content="AHL Visualizer" />
    <meta name="format-detection" content="telephone=no" />

    <title>American Hairline — AI Hair Consultation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => {
              console.log('[PWA] Service Worker registered with scope:', reg.scope);
            },
            (err) => {
              console.warn('[PWA] Service Worker registration failed:', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
